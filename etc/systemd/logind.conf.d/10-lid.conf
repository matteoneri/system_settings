[Login]
# Hibernate is parked for now (resume from the swapfile on encrypted /home is
# unreliable), so lid close does a plain suspend (s2idle). pcloud-suspend.service
# tears pCloud down before systemd-suspend.service starts, so its FUSE mount
# can't stall the kernel freezer — that's what previously made suspend fail.
# NOTE: pure s2idle still slowly drains on battery, so a multi-hour unplugged
# lid-close can still run the battery down. Shut down instead for long periods.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
