"gpt-5.6-sol" = 1
gpt-6-astra = 4

[marketplaces.compound-engineering-plugin]
last_updated = "2026-08-23T05:43:59Z"
last_revision = "3ce5855fab3e230a2b40d267ebcbc81d6c403f74"
source_type = "git"
source = "https://github.com/EveryInc/compound-engineering-plugin.git"
ref = "main"

[plugins."compound-engineering@compound-engineering-plugin"]
enabled = true

[permissions.fnet-worktrees]
description = "Workspace writes, shared Git metadata, and loopback QA for fnet-presettle."
extends = ":workspace"

[permissions.fnet-worktrees.filesystem]
# Cargo targets and worktrees live here; see ~/.cargo/config.toml for why
# incremental is off (sccache cannot cache an incremental compilation).
# `.git` lets `git worktree add` register the new tree in `.git/worktrees/`.
"/home/matteo/Documents/Projects/ActiveProjects/FNA/fnet/fnet-presettle/.git" = "write"
# The worktrees themselves live outside the workspace, so `:workspace` does not cover them.
"/home/matteo/.cache/fnet-wt" = "write"
# Cargo targets. Never /tmp: it is a 32 GB tmpfs and a clean target here is ~65 GB.
"/home/matteo/.cache/fnet-target" = "write"
# Canonical Terraform state for the fnet-presettle dedicated replay/BM-6 box. Granted
# 2026-08-25 so a release session can provision AND destroy the box in one cycle
# (CLAUDE.md agent rule 7, as amended). Scoped to this state only — the sibling
# ../EC2 GPU state stays read-only so no session can address the live ds_ec2_gpu box.
"/home/matteo/Documents/Projects/ActiveProjects/FNA/terraform-gpu/EC2-fnet-replay" = "write"

[permissions.fnet-worktrees.network]
enabled = true
allow_local_binding = true

[permissions.fnet-worktrees.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

[permissions.all-worktrees]
description = "fnet-presettle plus portwatch: either account can work in either tree."
extends = "fnet-worktrees"

[permissions.all-worktrees.filesystem]
# `.git` lets `git worktree add` register a new tree in `.git/worktrees/` when the
# session is launched from a worktree under `.worktrees/` (outside its workspace root).
"/home/matteo/Documents/Projects/ActiveProjects/OWN/portwatch/.git" = "write"
# Worktrees live inside the repo; a session launched from one still needs the others' parent.
"/home/matteo/Documents/Projects/ActiveProjects/OWN/portwatch/.worktrees" = "write"
# pre-merge-check baselines
"/home/matteo/.cache/portwatch" = "write"

[permissions.all-worktrees.network]
enabled = true
allow_local_binding = true

[permissions.all-worktrees.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

[notice]
hide_rate_limit_model_nudge = true
