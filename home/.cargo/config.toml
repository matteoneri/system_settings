# ~/.cargo/config.toml
#
# No rustc-wrapper here, and that is not a judgement about sccache. The fnet-presettle
# repository sets `build.rustc-wrapper = "sccache"` in its own .cargo/config.toml, which
# cargo discovers independently of CARGO_HOME, so builds in that workspace are cached
# whether or not this file says anything.
#
# A ~30-line comment block used to live here arguing that sccache "keys on the output
# directory" and must not be re-added. That was measured but wrong: --out-dir is explicitly
# excluded from sccache's cache key. The probe varied the target directory by EXPORTING
# CARGO_TARGET_DIR, which sccache does hash, so the output directory only looked causal.
#
# The correct account, with the source line numbers and the two verification methods, is in
# fnet-presettle/CLAUDE.md, section "The build standard". Read that rather than re-deriving
# it here; it has now been derived wrongly twice.

[alias]
# cargo-nextest — the everyday test runner
nt = "nextest run"
# ...and the debugging variant: run everything, show each failure in full
ntf = "nextest run --no-fail-fast --failure-output immediate-final"

# cargo-hack — the point of it is feature combinations, which are verbose to type
hack-powerset = "hack check --feature-powerset --no-dev-deps"
hack-each = "hack check --each-feature --no-dev-deps"

# cargo-machete — unused-dependency scan
unused = "machete"
