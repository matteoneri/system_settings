# cargo-deny policy — run `cargo deny check` (schema: cargo-deny 0.20.x).
#
# Enforcing by intent: a finding here should fail, not scroll past. Widen a rule
# deliberately (add to `allow`/`exceptions`/`skip` with a reason) rather than
# downgrading a severity, so every loosening stays visible in the diff.

[advisories]
# Vulnerabilities and unmaintained crates are denied by default in 0.20.
# List specific advisories here only with a reason, e.g.
#   { id = "RUSTSEC-2024-0001", reason = "no upgrade path yet; not reachable from our code" }
ignore = []

[licenses]
# Permissive licences only. Anything outside this set fails until reviewed —
# copyleft entering a payments codebase is a decision, not a dependency detail.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Added after the first real run against this workspace's tree:
    "CC0-1.0",              # tiny-keccak — public-domain dedication
    "CDLA-Permissive-2.0",  # webpki-roots — permissive, no copyleft
    "BSL-1.0",              # xxhash-rust — Boost, permissive
]
confidence-threshold = 0.9
# Per-crate escapes when a licence is fine for us but not blanket-allowed:
#   { crate = "some-crate", allow = ["MPL-2.0"] }
exceptions = []

[licenses.private]
# Our own unpublished workspace crates carry no licence field and should not be
# judged as third-party dependencies. NOTE: this only takes effect for crates
# that declare `publish = false` — see the fnet-engine note below.
ignore = true

[bans]
# Duplicate versions are usually someone else's transitive fact, so warn.
# A wildcard version requirement is ours and always a mistake, so deny.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# crates.io only. An unexpected registry or a git dependency has to be added
# here on purpose — that is exactly the supply-chain surface worth noticing.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
